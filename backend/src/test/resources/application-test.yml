spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:mysql://localhost:3306/tripplanner_test?createDatabaseIfNotExist=true}
    username: ${TEST_DB_USERNAME:root}
    password: ${TEST_DB_PASSWORD:}

app:
  jwt:
    # Secret chỉ dùng cho test, không dùng ở môi trường thật
    secret: test-only-secret-key-for-integration-tests-0123456789
    expiration-days: 7
  google:
    client-id: test-client-id.apps.googleusercontent.com
  seed:
    enabled: false
