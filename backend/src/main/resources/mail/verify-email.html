<h1 style="margin:0 0 12px 0;font-size:22px;line-height:1.3;color:#3a2430;">Xác minh email nhận thông báo</h1>
<p style="margin:0 0 12px 0;">Chào <b th:text="${displayName}">bạn</b>,</p>
<p style="margin:0 0 20px 0;">
  Bạn vừa đặt <b th:text="${email}">email</b> làm email nhận thông báo của Trip Planner.
  Bấm nút dưới đây để xác nhận đây đúng là hộp thư của bạn.
</p>
<p style="margin:0 0 20px 0;">
  <a th:href="${link}"
     style="display:inline-block;background:#e25c72;color:#ffffff;text-decoration:none;font-weight:700;padding:12px 24px;border-radius:999px;">
    Xác minh email
  </a>
</p>
<p style="margin:0 0 8px 0;font-size:13px;color:#8a7380;">
  Liên kết có hiệu lực trong <span th:text="${hours}">24</span> giờ. Nếu không phải bạn yêu cầu, cứ bỏ qua email này.
</p>
<p style="margin:0;font-size:12px;color:#8a7380;word-break:break-all;" th:text="${link}">link</p>
