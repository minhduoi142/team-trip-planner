<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Trip Planner</title>
</head>
<body style="margin:0;padding:0;background:#fcf7f9;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#3a2430;">
<!--/* Dòng tóm tắt hiện cạnh tiêu đề trong hộp thư (ẩn trong thân mail) */-->
<div style="display:none;max-height:0;overflow:hidden;opacity:0;" th:text="${preheader}">preheader</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fcf7f9;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;">
        <tr>
          <td style="padding:0 8px 16px 8px;font-size:18px;font-weight:700;color:#e25c72;">✈️ Trip Planner</td>
        </tr>
        <tr>
          <td style="background:#ffffff;border-radius:24px;padding:28px 24px;border:1px solid #f3e3ea;font-size:15px;line-height:1.6;"
              th:utext="${bodyHtml}">body</td>
        </tr>
        <tr>
          <td style="padding:16px 8px 0 8px;font-size:12px;line-height:1.6;color:#8a7380;">
            <p style="margin:0 0 8px 0;" th:if="${footerNote}" th:text="${footerNote}">footer</p>
            <p style="margin:0;" th:if="${links != null and !links.isEmpty()}">
              <th:block th:each="link, stat : ${links}">
                <a th:href="${link.url()}" th:text="${link.label()}" style="color:#8a7380;text-decoration:underline;">link</a><span
                  th:unless="${stat.last}"> · </span>
              </th:block>
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
