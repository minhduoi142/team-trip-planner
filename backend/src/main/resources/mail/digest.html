<h1 style="margin:0 0 4px 0;font-size:22px;line-height:1.3;color:#3a2430;" th:text="${tripTitle}">Chuyến đi</h1>
<p style="margin:0 0 20px 0;color:#8a7380;" th:text="${heading}">Có cập nhật mới</p>

<th:block th:each="section : ${sections}">
  <p style="margin:0 0 8px 0;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#e25c72;"
     th:text="${section.title()}">Mục</p>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 20px 0;">
    <tr th:each="item : ${section.items()}">
      <td style="padding:10px 12px;border-radius:14px;background:#fcf7f9;border-bottom:4px solid #ffffff;">
        <div style="font-weight:600;" th:text="${item.text()}">Nội dung</div>
        <div style="font-size:13px;color:#8a7380;" th:if="${item.detail() != null}" th:text="${item.detail()}">Chi tiết</div>
      </td>
    </tr>
  </table>
</th:block>

<p style="margin:4px 0 0 0;" th:if="${buttonUrl != null}">
  <a th:href="${buttonUrl}" th:text="${buttonLabel}"
     style="display:inline-block;background:#e25c72;color:#ffffff;text-decoration:none;font-weight:700;padding:12px 24px;border-radius:999px;">
    Mở chuyến đi
  </a>
</p>
