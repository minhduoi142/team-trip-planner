spring:
  application:
    name: trip-planner
  config:
    # Nạp biến từ backend/.env khi chạy local (không bắt buộc có). Biến môi trường thật vẫn được ưu tiên.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tripplanner?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  mail:
    # Trống = tắt gửi email (thông báo bị bỏ qua, nút gửi mail báo "chưa cấu hình").
    # Local: Mailpit (localhost:1025, không auth/TLS). Thật: smtp.gmail.com:587 + Gmail App Password.
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

app:
  jwt:
    # Bắt buộc đặt qua biến môi trường, tối thiểu 32 byte
    secret: ${JWT_SECRET:}
    # Access token ngắn; phiên dài do refresh token (cookie HttpOnly) đảm nhiệm
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
  auth:
    refresh-ttl-days: ${AUTH_REFRESH_TTL_DAYS:14}
    family-max-days: ${AUTH_FAMILY_MAX_DAYS:60}
    reuse-grace-seconds: ${AUTH_REUSE_GRACE_SECONDS:10}
    # Tắt Secure chỉ khi chạy HTTP không phải localhost (vd truy cập bằng IP)
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Strict}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  timezone: Asia/Ho_Chi_Minh
  # Trang /share/{code} chuyển người dùng tới FE; og:image cần URL tuyệt đối của backend
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  storage:
    # Kho ảnh chuẩn S3 (MinIO local; Phase 5 có thể là R2/S3). Bỏ trống endpoint = tắt upload (trả 503).
    endpoint: ${MINIO_ENDPOINT:}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:trip-planner}
    public-url: ${MINIO_PUBLIC_URL:}
    # Giấy tờ chuyến đi (vé, CCCD…): bucket RIÊNG TƯ, không bao giờ bật đọc công khai (docs/sdd-trip-documents.md)
    private-bucket: ${MINIO_PRIVATE_BUCKET:trip-planner-private}
  mail:
    # Gmail: phải trùng MAIL_USERNAME, nếu không Gmail tự thay bằng địa chỉ đăng nhập
    from: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:Trip Planner}
  # Tên "notifications" (không phải "notify": trùng Object.notify() trong record AppProperties)
  notifications:
    scheduler-enabled: ${NOTIFY_SCHEDULER_ENABLED:true}
    # Bao lâu quét outbox 1 lần (mail đi chậm nhất ~ khoảng này)
    dispatch-interval-ms: ${NOTIFY_DISPATCH_INTERVAL_MS:10000}
    # Chờ bao nhiêu phút trước khi gửi để gộp nhiều sự kiện cùng chuyến vào 1 email. 0 = gửi ngay
    delay-minutes: ${NOTIFY_DELAY_MINUTES:0}
    batch-size: 50
    # Gmail cá nhân ~500 người nhận/ngày (vượt bị khoá gửi 24h) → chừa biên
    daily-limit: ${NOTIFY_DAILY_LIMIT:400}
    countdown-days: ${NOTIFY_COUNTDOWN_DAYS:7,3,1,0}
    countdown-cron: ${NOTIFY_COUNTDOWN_CRON:0 0 8 * * *}
  # Dự báo thời tiết Open-Meteo (docs/sdd-weather.md). Không cần key với gói miễn phí (phi thương mại).
  weather:
    enabled: ${WEATHER_ENABLED:true}
    forecast-url: ${WEATHER_FORECAST_URL:https://api.open-meteo.com/v1/forecast}
    geocoding-url: ${WEATHER_GEOCODING_URL:https://geocoding-api.open-meteo.com/v1/search}
    # Tìm địa điểm chi tiết (làng/bản, xã, thác, hồ… từ OpenStreetMap). Trống = chỉ dùng Open-Meteo
    photon-url: ${WEATHER_PHOTON_URL:https://photon.komoot.io/api/}
    archive-url: ${WEATHER_ARCHIVE_URL:https://archive-api.open-meteo.com/v1/archive}
    # Trống = gói miễn phí; có key (gói trả phí) thì đổi các URL sang customer-*.open-meteo.com
    api-key: ${WEATHER_API_KEY:}
    forecast-days: 16
    cache-ttl-minutes: 120
    stale-max-hours: 24
    negative-ttl-seconds: 120
    max-entries: 300
    connect-timeout-ms: 2000
    read-timeout-ms: 3000
  seed:
    # Chỉ bật ở local để tạo tài khoản + chuyến đi mẫu (DevDataSeeder). KHÔNG bật trên production.
    enabled: ${APP_SEED_ENABLED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  health:
    # Không để /actuator/health phụ thuộc kết nối SMTP (Gmail chậm/đứt → health DOWN)
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
