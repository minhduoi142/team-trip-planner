spring:
  application:
    name: trip-planner
  config:
    # Nạp biến từ backend/.env khi chạy local (không bắt buộc có). Biến môi trường thật vẫn được ưu tiên.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tripplanner?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

app:
  jwt:
    # Bắt buộc đặt qua biến môi trường, tối thiểu 32 byte
    secret: ${JWT_SECRET:}
    expiration-days: ${JWT_EXPIRATION_DAYS:7}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  timezone: Asia/Ho_Chi_Minh
  storage:
    # Kho ảnh chuẩn S3 (MinIO local; Phase 5 có thể là R2/S3). Bỏ trống endpoint = tắt upload (trả 503).
    endpoint: ${MINIO_ENDPOINT:}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:trip-planner}
    public-url: ${MINIO_PUBLIC_URL:}
  seed:
    # Chỉ bật ở local để tạo tài khoản + chuyến đi mẫu (DevDataSeeder). KHÔNG bật trên production.
    enabled: ${APP_SEED_ENABLED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
