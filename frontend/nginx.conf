# SPA: mọi đường dẫn không phải file tĩnh → index.html (React Router xử lý)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # File có hash trong tên (Vite) → cache lâu
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Video nền + poster (public/, tên không hash) → cache 7 ngày; nginx tự hỗ trợ Range (206) cho Safari/iOS
    location ~ ^/trip-bg[^/]*\.(mp4|webm|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        # index.html không cache để bản deploy mới có hiệu lực ngay
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
