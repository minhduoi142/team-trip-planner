# Hạ tầng local cho dev: MinIO (lưu ảnh upload) + Mailpit (xem email thông báo). Chạy:  docker compose up -d
# Console quản lý: http://localhost:9001 (đăng nhập bằng MINIO_ROOT_USER / MINIO_ROOT_PASSWORD trong .env ở thư mục gốc)
#
# LƯU Ý: MinIO đã ngừng phát hành image Docker công khai (Docker Hub gỡ minio/minio, quay.io yêu cầu đăng nhập).
# Compose ghim bản đang có sẵn trong máy và KHÔNG tự pull. Máy mới cần có sẵn image này
# (docker load từ file .tar export ra, hoặc build MinIO từ source). Production sẽ chọn kho S3 ở Phase 5.

services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    pull_policy: never
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Thiếu MINIO_ROOT_USER trong .env ở thư mục gốc}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Thiếu MINIO_ROOT_PASSWORD trong .env ở thư mục gốc}
    ports:
      - "9000:9000"   # S3 API (backend + trình duyệt tải ảnh)
      - "9001:9001"   # Console
    volumes:
      - minio-data:/data
    restart: unless-stopped

  # Chạy 1 lần: tạo bucket + cho phép đọc công khai (ảnh dùng tên UUID ngẫu nhiên). Image MinIO có sẵn `mc`.
  minio-init:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    pull_policy: never
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-trip-planner}
    entrypoint: >
      sh -c '
      until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do sleep 1; done;
      mc mb --ignore-existing "local/$$MINIO_BUCKET" &&
      mc anonymous set download "local/$$MINIO_BUCKET" &&
      echo "Bucket $$MINIO_BUCKET sẵn sàng (đọc công khai)"
      '
    restart: "no"

  # Hộp thư giả để xem email thông báo khi dev (không gửi ra ngoài). Giao diện: http://localhost:8025
  # backend/.env: MAIL_HOST=localhost, MAIL_PORT=1025, MAIL_SMTP_AUTH=false, MAIL_STARTTLS=false
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Giao diện web
    restart: unless-stopped

volumes:
  minio-data:
