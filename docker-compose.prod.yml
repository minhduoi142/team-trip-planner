# Production trên 1 VPS, reverse proxy là NGINX CỦA MÁY CHỦ (không chạy Caddy trong Docker).
# Mọi cổng chỉ mở trên 127.0.0.1; nginx máy chủ proxy:
#   /api/, /share/   → 127.0.0.1:8080 (backend)
#   /trip-planner/   → 127.0.0.1:9000 (MinIO, ảnh upload)
#   /                → 127.0.0.1:3000 (frontend)
#
# Chạy (thư mục gốc repo):
#   cp .env.prod.example .env.prod   # rồi điền giá trị (lần đầu)
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Biến môi trường của backend dùng ĐÚNG tên mà application.yml đọc (DB_URL, JWT_SECRET, MAIL_HOST...).

name: tripplanner

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Biến VITE_* nướng vào bundle lúc build → đổi giá trị phải build lại (--build)
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        VITE_SHARE_BASE_URL: ${PUBLIC_URL:-https://minhduoipro.ddns.net}
        VITE_CONTACT_ZALO: ${CONTACT_ZALO:-}
        VITE_CONTACT_EMAIL: ${CONTACT_EMAIL:-}
    image: tripplanner-frontend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    mem_limit: 128m

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: tripplanner-backend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    environment:
      TZ: Asia/Ho_Chi_Minh
      # Database
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-tripplanner}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
      DB_USERNAME: ${MYSQL_USER:-tripplanner}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Thiếu MYSQL_PASSWORD}
      # Đăng nhập
      JWT_SECRET: ${JWT_SECRET:?Thiếu JWT_SECRET (>= 32 ký tự)}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Địa chỉ công khai (FE và BE cùng tên miền qua nginx máy chủ)
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:-https://minhduoipro.ddns.net}
      FRONTEND_URL: ${PUBLIC_URL:-https://minhduoipro.ddns.net}
      # og:image của link share + link "Huỷ đăng ký" 1 chạm trong email
      PUBLIC_BASE_URL: ${PUBLIC_URL:-https://minhduoipro.ddns.net}
      # Ảnh upload (MinIO trong cùng compose)
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: ${PUBLIC_URL:-https://minhduoipro.ddns.net}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Thiếu MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Thiếu MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-trip-planner}
      # Email thông báo (Gmail SMTP + App Password). MAIL_HOST trống = tắt gửi email.
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Trip Planner}
      NOTIFY_DAILY_LIMIT: ${NOTIFY_DAILY_LIMIT:-400}
      # 0 = gửi ngay (lượt quét kế tiếp, mỗi NOTIFY_DISPATCH_INTERVAL_MS); > 0 = chờ để gộp nhiều sự kiện vào 1 email
      NOTIFY_DELAY_MINUTES: ${NOTIFY_DELAY_MINUTES:-0}
      NOTIFY_DISPATCH_INTERVAL_MS: ${NOTIFY_DISPATCH_INTERVAL_MS:-10000}
      # Dự báo thời tiết Open-Meteo (không cần key). false = ẩn thời tiết, không gọi ra ngoài
      WEATHER_ENABLED: ${WEATHER_ENABLED:-true}
      # Tìm địa điểm chi tiết qua Photon/OpenStreetMap; đặt rỗng trong .env.prod = chỉ dùng Open-Meteo
      WEATHER_PHOTON_URL: ${WEATHER_PHOTON_URL-https://photon.komoot.io/api/}
      JAVA_OPTS: ${JAVA_OPTS:--Xmx384m -XX:+UseSerialGC}
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
    mem_limit: 512m

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_0900_ai_ci"
      - "--innodb-buffer-pool-size=128M"
      - "--performance-schema=OFF"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Thiếu MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tripplanner}
      MYSQL_USER: ${MYSQL_USER:-tripplanner}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Thiếu MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 300m

  minio:
    image: pgsty/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Thiếu MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Thiếu MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    mem_limit: 150m

  minio-init:
    image: pgsty/minio:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-trip-planner}
    entrypoint: >
      sh -c '
      until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do sleep 1; done;
      mc mb --ignore-existing "local/$$MINIO_BUCKET" &&
      mc anonymous set download "local/$$MINIO_BUCKET" &&
      echo "Bucket $$MINIO_BUCKET sẵn sàng"
      '
    restart: "no"

volumes:
  mysql-data:
  minio-data:
