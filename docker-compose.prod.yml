# Deploy production trên 1 VPS: Caddy (HTTPS) → frontend (nginx) / backend (Spring Boot) / MinIO (ảnh); MySQL.
# Hướng dẫn đầy đủ: docs/deploy-vps.md
#
#   cp .env.prod.example .env.prod   # rồi điền giá trị
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Chỉ Caddy mở cổng ra ngoài (80/443). MySQL, MinIO, backend chỉ nằm trong mạng nội bộ của compose.
# LƯU Ý MinIO: không còn image công khai → VPS phải có sẵn image (docker save/load, xem docs/deploy-vps.md).

name: tripplanner

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Thiếu SITE_ADDRESS (tên miền, vd trip.example.com)}
      MINIO_BUCKET: ${MINIO_BUCKET:-trip-planner}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - backend
      - minio

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_SHARE_BASE_URL: ${PUBLIC_URL}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        VITE_CONTACT_ZALO: ${CONTACT_ZALO:-}
        VITE_CONTACT_EMAIL: ${CONTACT_EMAIL:-}
    image: tripplanner-frontend:latest
    restart: unless-stopped

  backend:
    build: ./backend
    image: tripplanner-backend:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-tripplanner}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      DB_USERNAME: ${MYSQL_USER:-tripplanner}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Thiếu MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Thiếu JWT_SECRET (>= 32 ký tự)}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:?Thiếu PUBLIC_URL (vd https://trip.example.com)}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-trip-planner}
      MINIO_PUBLIC_URL: ${PUBLIC_URL}
      FRONTEND_URL: ${PUBLIC_URL}
      PUBLIC_BASE_URL: ${PUBLIC_URL}
      APP_SEED_ENABLED: "false"
      SPRINGDOC_API_DOCS_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
      JAVA_OPTS: ${JAVA_OPTS:--Xmx512m -XX:+UseSerialGC}

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Thiếu MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tripplanner}
      MYSQL_USER: ${MYSQL_USER:-tripplanner}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: UTC
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    pull_policy: never
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Thiếu MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Thiếu MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    # Console 9001 KHÔNG mở ra ngoài; truy cập qua SSH tunnel (xem docs/deploy-vps.md)
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"

  # Chạy 1 lần: tạo bucket + cho phép đọc công khai (tên file UUID)
  minio-init:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    pull_policy: never
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-trip-planner}
    entrypoint: >
      sh -c '
      until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do sleep 1; done;
      mc mb --ignore-existing "local/$$MINIO_BUCKET" &&
      mc anonymous set download "local/$$MINIO_BUCKET" &&
      echo "Bucket $$MINIO_BUCKET sẵn sàng"
      '
    restart: "no"

volumes:
  mysql-data:
  minio-data:
  caddy-data:
  caddy-config:
